<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sell a Product | AgroLink</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <nav>
            <h1>AgroLink</h1>

            <a href="index.html">Home</a>
            <a href="marketplace.html">Marketplace</a>
            <a href="prices.html">Prices</a>
            <a href="agroconnect.html">AgroConnect</a>

            <a href="my-profile.html" class="profile-button">Profile</a>
        </nav>
    </header>


    <main>

        <section class="sell-product">

            <h2>List a Product</h2>

            <p>
                Add a product you want to sell on AgroLink.
            </p>

            <form id="productForm">

                <label for="productName">Product Name</label>
                <input
                    type="text"
                    id="productName"
                    placeholder="e.g. Tomatoes"
                    required
                >


                <label for="productPrice">Price</label>
                <input
                    type="number"
                    id="productPrice"
                    placeholder="e.g. 15000"
                    required
                >


                <label for="productQuantity">Quantity Available</label>
                <input
                    type="number"
                    id="productQuantity"
                    placeholder="e.g. 20"
                    required
                >


                <label for="productLocation">Location</label>
                <input
                    type="text"
                    id="productLocation"
                    placeholder="e.g. Lagos"
                    required
                >


                <label for="productAvailability">Availability</label>
                <select id="productAvailability" required>
                    <option value="available">Available</option>
                    <option value="out-of-stock">Out of Stock</option>
                </select>


                <button type="submit">List Product</button>

            </form>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
