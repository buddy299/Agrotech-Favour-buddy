<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AgroLink Market Prices</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <nav>
            <h1>AgroLink</h1>

            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="marketplace.html">Marketplace</a>
                <a href="prices.html">Prices</a>
                <a href="agroconnect.html">AgroConnect</a>
            </div>

            <button>Get started</button>
        </nav>
    </header>

    <main>

        <section class="prices">

            <div class="title">
                <p>AGRICULTURAL MARKET PRICES</p>

                <h2>Check Current Farm Produce Prices</h2>

                <p>
                    View agricultural prices sourced from Nigerian market data.
                </p>
            </div>

            <div class="price-search">

                <input
                    type="text"
                    id="price-search"
                    placeholder="Search for a product..."
                >

                <select id="price-category">
                    <option value="all">All Agricultural Products</option>
                    <option value="agriculture">Agriculture</option>
                    <option value="food-staples">Food Staples</option>
                </select>

                <button id="price-search-button">
                    Search
                </button>

            </div>

            <div id="price-results" class="price-container">

                <p class="price-loading">
                    Loading current market prices...
                </p>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
