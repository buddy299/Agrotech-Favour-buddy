<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile | AgroLink</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <nav>

        <h1>AgroLink</h1>

        <div class="nav-links">

            <a href="index.html">Home</a>
            <a href="marketplace.html">Marketplace</a>
            <a href="prices.html">Prices</a>
            <a href="agroconnect.html">AgroConnect</a>

        </div>

        <button onclick="window.location.href='marketplace.html'">
            Marketplace
        </button>

    </nav>

</header>


<main>

    <section class="my-profile">


        <div id="no-profile-message">

            <p>WELCOME TO AGROLINK</p>

            <h2>You don't have a profile yet.</h2>

            <p>
                Create your AgroLink profile to showcase
                yourself and connect with potential buyers.
            </p>

            <button onclick="window.location.href='create-profile.html'">
                Create Your Profile
            </button>

        </div>


        <div class="my-profile-info">

            <p>MY PROFILE</p>

            <h2 id="my-profile-name"></h2>

            <h3 id="my-profile-farm"></h3>

            <p id="my-profile-location"></p>

            <p id="my-profile-description"></p>

        </div>


        <div class="my-profile-actions">

            <button id="edit-profile">
                Edit Profile
            </button>

            <button
                id="list-product"
                onclick="window.location.href='sell-product.html'"
            >
                List a Product
            </button>

        </div>


        <div class="my-products">

            <h2>My Products</h2>

            <div id="my-product-list"></div>

        </div>


    </section>

</main>


<script src="script.js"></script>

</body>

</html>
