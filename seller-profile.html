<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Seller Profile | AgroLink</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <nav>

            <h1>AgroLink</h1>

            <div class="nav-links">

                <a href="index.html">Home</a>
                <a href="marketplace.html">Marketplace</a>
                <a href="prices.html">Prices</a>
                <a href="agroconnect.html">AgroConnect</a>

            </div>

            <button onclick="window.location.href='create-profile.html'">
                Create Profile
            </button>

        </nav>

    </header>


    <main>

        <section class="seller-profile">

            <div class="seller-profile-info">

                <h2 id="profile-farm-name"></h2>

                <p id="profile-owner"></p>

                <p id="profile-location"></p>

                <p id="profile-rating"></p>

                <p id="profile-products"></p>

                <p id="profile-description"></p>

                <button id="message-seller">
                    Message Seller
                </button>

                <button id="delete-profile-button">Delete Profile</button>

            </div>


            <div class="seller-products">

                <h2>Available Products</h2>

                <div
                    class="seller-product-list"
                    id="seller-product-list">
                </div>

            </div>

        </section>

    </main>

<div id="delete-popup" class="delete-popup">

    <div class="delete-popup-box">

        <h2>Delete Profile?</h2>

        <p>
            Are you sure you want to delete your profile?
            This action cannot be undone.
        </p>

        <div class="delete-popup-buttons">

            <button id="cancel-delete">
                Cancel
            </button>

            <button id="confirm-delete">
                Delete
            </button>

        </div>

    </div>

</div>

<div id="delete-success-popup" class="delete-popup">

    <div class="delete-popup-box">

        <h2>Profile Deleted</h2>

        <p>
            Your AgroLink profile has been deleted successfully.
        </p>

        <button id="success-ok">
            OK
        </button>

    </div>

</div>
    <script src="script.js"></script>

</body>

</html>
